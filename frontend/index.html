<!DOCTYPE html>
<html lang="en">
<head>
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

<div class="bg-orbs">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
</div>

<div class="app">
    <div class="app-header">
        <div class="header-icon">✦</div>
        <h1>Task Manager</h1>
        <p class="subtitle">Stay focused. Ship it.</p>
    </div>

    <div class="stats-bar">
        <div class="stat">
            <span class="stat-num" id="totalCount">0</span>
            <span class="stat-label">Total</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat">
            <span class="stat-num" id="doneCount">0</span>
            <span class="stat-label">Done</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat">
            <span class="stat-num" id="pendingCount">0</span>
            <span class="stat-label">Pending</span>
        </div>
    </div>

    <div class="input-section">
        <div class="input-box">
            <span class="input-icon">+</span>
            <input id="taskInput" placeholder="What needs to be done?" autocomplete="off" />
            <button onclick="addTask()" class="add-btn">
                <span>Add</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </button>
        </div>
    </div>

    <div class="filter-tabs">
        <button class="tab active" onclick="filterTasks('all', this)">All</button>
        <button class="tab" onclick="filterTasks('pending', this)">Pending</button>
        <button class="tab" onclick="filterTasks('done', this)">Done</button>
    </div>

    <ul id="taskList"></ul>

    <div class="empty-state" id="emptyState">
        <div class="empty-icon">◎</div>
        <p>No tasks yet. Add one above!</p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
